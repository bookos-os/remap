[package]
name = "bookos-teclas"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-BookOS"

[features]
pruebas-ui = []

[dependencies]
bookos-ui = { path = "../../plantilla-gpui/bookos-ui" }
gpui = { path = "../../fonts/vendor/gpui/crates/gpui", default-features = false, features = ["font-kit", "wayland"] }
gpui_platform = { path = "vendor/gpui_platform", features = ["wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
xkbcommon = { version = "0.8", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
